# MCP Server Catalog
#
# This file is the source of truth for which MCP servers belong to this
# agent framework.  It is checked into git.  The cloned source repos and
# Docker build artefacts live in ./mcp-servers/ which is git-ignored.
#
# Bootstrap from scratch (new machine / fresh clone):
#   bash .github/skills/setup-mcp-server/scripts/bootstrap.sh
#
# Add a new server:
#   1. Add an entry below following the same format.
#   2. Run /setup-mcp-server <url> in Copilot Chat  — or call bootstrap.sh.
#   3. Commit mcp-catalog.yaml, .vscode/mcp.json, and .mcp-dockerfiles/<name>/Dockerfile.
#
# Format of each entry:
#   - key: <server-key>                    # key used in .vscode/mcp.json
#     url: <github-url>                    # full GitHub URL (may point to a subdir)
#     patched_dockerfile: <relative-path>  # path to the patched Dockerfile in .mcp-dockerfiles/
#                                          # (relative to repo root; set by fix-docker-perms skill)
#     description: <short text>
#     notes: <optional notes about env vars, mounts, etc.>

servers:
  - key: git
    url: https://github.com/modelcontextprotocol/servers/tree/main/src/git
    patched_dockerfile: .mcp-dockerfiles/servers-git/Dockerfile
    description: Git operations — status, diff, log, commit, branch, checkout, show
    notes: >
      Requires /home bind-mounted into the container so the agent can pass
      host repo_path values directly. Already configured in .vscode/mcp.json.

  - key: sequentialthinking
    url: https://github.com/modelcontextprotocol/servers/tree/main/src/sequentialthinking
    patched_dockerfile: .mcp-dockerfiles/servers-sequentialthinking/Dockerfile
    description: An MCP server implementation that provides a tool for dynamic and reflective problem-solving through a structured thinking process.

  - key: memory
    url: https://github.com/modelcontextprotocol/servers/tree/main/src/memory
    patched_dockerfile: .mcp-dockerfiles/servers-memory/Dockerfile
    description: A basic implementation of persistent memory using a local knowledge graph. This lets an agent remember information about the user across chats.
